name: Release

# Push a tag like v1.0.2 to build the .mcpb and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi
      - run: npm run pack
      - run: npx mcpb validate dist/manifest.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp youtube-mcp.mcpb YouTube.mcpb
          gh release create "$GITHUB_REF_NAME" YouTube.mcpb --title "$GITHUB_REF_NAME" --generate-notes
